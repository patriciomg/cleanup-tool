name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-vet:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Verify version string
        run: make test-version

  release-smoke-test:
    name: Build release artifacts on macOS
    runs-on: macos-latest
    needs: test-and-vet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release
        run: make release

      - name: Verify release artifacts exist
        run: |
          test -f "dist/cleanup-tool-darwin-universal"
          test -f "dist/checksums.txt"
          test -f "dist/cleanup-tool"-*-darwin-universal.tar.gz
          cat dist/checksums.txt

      - name: Verify universal binary version
        run: |
          version=$(./dist/cleanup-tool-darwin-universal -version)
          echo "$version"
          echo "$version" | grep -qE 'cleanup-tool v[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "ERROR: version string does not match expected format"
            exit 1
          }

      - name: Verify tarball contents and checksum
        run: |
          mkdir -p /tmp/release-smoke
          tar -xzf dist/cleanup-tool-*-darwin-universal.tar.gz -C /tmp/release-smoke
          find /tmp/release-smoke -name "cleanup-tool" -type f -executable
          cd dist && shasum -a 256 -c checksums.txt
