name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-vet:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Verify version string
        run: make test-version

  test-actions-no-rsync:
    name: Test actions package without rsync
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run actions tests with rsync removed from PATH
        run: |
          go_bin=$(command -v go)
          go_dir="${go_bin%/*}"
          PATH="$go_dir" go test ./internal/actions/...

  test-actions-osascript:
    name: Test real osascript on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run actions integration tests with real osascript
        env:
          TEST_REAL_OSASCRIPT: "1"
        run: go test ./internal/actions/... -v -run TestIntegration

  test-docker-mock:
    name: Test docker package with mock Docker daemon
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run docker tests with mock daemon
        run: go test ./internal/docker/...

  release-smoke-test:
    name: Build release artifacts on macOS
    runs-on: macos-latest
    needs: test-and-vet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release
        run: make release

      - name: Verify release artifacts exist
        run: |
          test -f "dist/cleanup-tool-darwin-universal"
          test -f "dist/checksums.txt"
          test -f "dist/cleanup-tool"-*-darwin-universal.tar.gz
          cat dist/checksums.txt

      - name: Verify universal binary version
        run: |
          version=$(./dist/cleanup-tool-darwin-universal -version)
          echo "$version"
          echo "$version" | grep -qE 'cleanup-tool v[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "ERROR: version string does not match expected format"
            exit 1
          }

      - name: Verify tarball contents and checksum
        run: |
          mkdir -p /tmp/release-smoke
          tar -xzf dist/cleanup-tool-*-darwin-universal.tar.gz -C /tmp/release-smoke
          find /tmp/release-smoke -name "cleanup-tool" -type f -exec test -x {} \; -print
          cd dist && shasum -a 256 -c checksums.txt

  test-benchmark-format:
    name: Verify benchmark output format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: go build -o cleanup-tool ./cmd/cleanup-tool

      - name: Create deterministic sample directory
        run: ./testdata/create-benchmark-sample.sh

      - name: Run benchmark and normalize output
        run: |
          ./cleanup-tool -benchmark -paths /tmp/cleanup-benchmark-sample | sed -E 's/Total time: .*/Total time: <TIME>/; s/Avg throughput: .*/Avg throughput: <THROUGHPUT>/' > normalized.txt

      - name: Compare with snapshot
        run: |
          if ! diff -u testdata/benchmark-snapshot.txt normalized.txt; then
            echo "::error::Benchmark output format changed. Update testdata/benchmark-snapshot.txt and the 'Benchmark mode' section in README.md."
            exit 1
          fi

  test-help-format:
    name: Verify CLI -help output format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: go build -o cleanup-tool ./cmd/cleanup-tool

      - name: Run -help and normalize output
        run: |
          ./cleanup-tool -h 2>&1 | sed 's/^Usage of .*:$/Usage of <binary>:/' > help.txt

      - name: Compare with snapshot
        run: |
          if ! diff -u testdata/help-snapshot.txt help.txt; then
            echo "::error::CLI help output format changed. Update testdata/help-snapshot.txt and the CLI flags table in README.md."
            exit 1
          fi

  test-export-format:
    name: Verify export output formats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: go build -o cleanup-tool ./cmd/cleanup-tool

      - name: Create deterministic sample directory
        run: ./testdata/create-export-sample.sh

      - name: Generate and normalize export outputs
        run: |
          ./cleanup-tool -format json -stdout -paths /tmp/cleanup-export-sample-fmt > export.json
          ./cleanup-tool -format csv -stdout -paths /tmp/cleanup-export-sample-fmt > export.csv
          ./cleanup-tool -format tsv -stdout -paths /tmp/cleanup-export-sample-fmt > export.tsv
          ./cleanup-tool -format yaml -stdout -paths /tmp/cleanup-export-sample-fmt > export.yaml
          ./testdata/normalize-export.sh json export.json > normalized.json
          ./testdata/normalize-export.sh csv export.csv > normalized.csv
          ./testdata/normalize-export.sh tsv export.tsv > normalized.tsv
          ./testdata/normalize-export.sh yaml export.yaml > normalized.yaml

      - name: Compare with snapshots
        run: |
          failed=0
          for fmt in json csv tsv yaml; do
            if ! diff -u "testdata/export-snapshots/${fmt}.txt" "normalized.${fmt}"; then
              echo "::error::${fmt} export output format changed. Update testdata/export-snapshots/${fmt}.txt and the 'Exporting results' section in README.md."
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            exit 1
          fi

  brew-audit:
    name: Audit Homebrew formula
    runs-on: macos-latest

    steps:
      - name: Checkout Homebrew tap repository
        uses: actions/checkout@v4
        with:
          repository: patriciomg/homebrew-cleanup-tool
          path: /tmp/homebrew-cleanup-tool

      - name: Audit formula in tap repository
        run: |
          brew untap patriciomg/cleanup-tool 2>/dev/null || true
          brew tap patriciomg/cleanup-tool "${{ github.workspace }}/homebrew-cleanup-tool"
          brew audit --new patriciomg/cleanup-tool/cleanup-tool
